name: Controles Ecclesia
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Iniciar PostgreSQL embebido
        run: npm run db:embedded > /tmp/ecclesia-db.log 2>&1 &
      - name: Preparar base de prueba
        run: |
          printf 'DATABASE_URL=postgres://postgres:postgres@127.0.0.1:5433/postgres\nJWT_SECRET=ci-only-ephemeral-secret-32-characters\nPORT=4300\n' > .env
          for i in $(seq 1 30); do
            if node --env-file=.env -e "const pg=require('pg');const c=new pg.Client({connectionString:process.env.DATABASE_URL});c.connect().then(()=>c.end()).catch(()=>process.exit(1))" >/dev/null 2>&1; then break; fi
            sleep 1
          done
          npm run db:migrate
          npm run db:seed
      - run: npm run test:integration
