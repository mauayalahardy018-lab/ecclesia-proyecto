services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ecclesia
      POSTGRES_USER: ecclesia
      POSTGRES_PASSWORD: ecclesia_dev
    ports:
      - "5432:5432"
    volumes:
      - ecclesia_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecclesia -d ecclesia"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  ecclesia_pgdata:
